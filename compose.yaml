services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Africa/Nairobi
      - TZ=Africa/Nairobi
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=medcoding
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=icd
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcoding -d icd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  n8n_data:
  pg_data:
